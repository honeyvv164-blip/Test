<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Malatang Layout</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        #info {
            position: absolute; top: 15px; left: 15px; color: #fff;
            background: rgba(0,0,0,0.8); padding: 12px 18px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #e74c3c;
        }
        #info h2 { margin: 0 0 4px 0; font-size: 16px; color: #e74c3c; }
        #info p { margin: 0; font-size: 12px; color: #aaa; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h2>ร้านหม่าล่าทัง 3D (จำลองตามผัง)</h2>
        <p>🖱️ หมุน: คลิกซ้ายลาก | ย้าย: คลิกขวาลาก | ซูม: สกรอลล์เมาส์</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // ไฟในฉาก
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const light = new THREE.DirectionalLight(0xffffff, 0.8);
        light.position.set(15, 30, 15);
        light.castShadow = true;
        scene.add(light);

        // วัสดุ (Colors)
        const matFloor = new THREE.MeshStandardMaterial({ color: 0xdddddd });
        const matFloorBack = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const matWallRed = new THREE.MeshStandardMaterial({ color: 0xa00000 });
        const matWallWhite = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
        const matTable = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const matChair = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
        const matDark = new THREE.MeshStandardMaterial({ color: 0x222222 });
        const matMetal = new THREE.MeshStandardMaterial({ color: 0xbbbbbb, metalness: 0.5 });

        // พื้นร้าน
        const floorMain = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 14), matFloor);
        floorMain.position.set(-2, -0.1, 0); floorMain.receiveShadow = true; scene.add(floorMain);

        const floorBack = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 14), matFloorBack);
        floorBack.position.set(9, -0.1, 0); floorBack.receiveShadow = true; scene.add(floorBack);

        // ฟังก์ชันสร้างผนัง
        function addWall(x, z, w, d, color = matWallWhite) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2.5, d), color);
            wall.position.set(x, 1.25, z); wall.castShadow = true; scene.add(wall);
        }

        // ผนังรอบนอก & ภายใน
        addWall(-10.1, 0, 0.2, 14, matWallRed);
        addWall(0, -7.1, 20.4, 0.2, matWallRed);
        addWall(12.1, 0, 0.2, 14);
        addWall(-6, 7.1, 8.4, 0.2); addWall(6, 7.1, 12.4, 0.2);
        addWall(6, -0.5, 0.2, 13.2);
        addWall(3, -5.5, 6, 0.2, matWallRed);
        addWall(9, -4, 6, 0.2);

        // ฟังก์ชันสร้างชุดโต๊ะ 4 คน
        function addTable(x, z) {
            const group = new THREE.Group();
            const table = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 2), matTable);
            table.position.y = 1; table.castShadow = true; group.add(table);
            
            for(let i = -0.4; i <= 0.4; i += 0.8) {
                for(let j = -0.4; j <= 0.4; j += 0.8) {
                    const stove = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, 0.35), matDark);
                    stove.position.set(i, 1.05, j); group.add(stove);
                }
            }
            [[-1.2,0], [1.2,0], [0,-1.2], [0,1.2]].forEach(p => {
                const chair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), matChair);
                chair.position.set(p[0], 0.25, p[1]); chair.castShadow = true; group.add(chair);
            });
            group.position.set(x, 0, z); scene.add(group);
        }

        // ฟังก์ชันสร้างที่นั่งกั้นฝั่งซ้าย (Introvert Zone)
        function addBooth(x, z) {
            const group = new THREE.Group();
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.4, 0.1), matWallRed);
            wall.position.set(0, 0.7, 0); group.add(wall);
            const table = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1), matTable);
            table.position.set(0, 0.8, -0.6); group.add(table);
            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.5), matChair);
            seat.position.set(0, 0.2, -1.2); group.add(seat);
            group.position.set(x, 0, z); scene.add(group);
        }

        // วางวัตถุในร้าน
        addTable(-3.5, -2); addTable(-3.5, 2.5);
        addTable(1.5, -2);  addTable(1.5, 2.5);

        [-3.5, -1.2, 1.1, 3.4].forEach(z => addBooth(-8.8, z));

        // แคชเชียร์
        const cashier = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.1, 1.2), matWallRed);
        cashier.position.set(-8, 0.55, 5); scene.add(cashier);

        // โซนตักอาหาร
        const foodStation = new THREE.Mesh(new THREE.BoxGeometry(6, 1.2, 1.8), matMetal);
        foodStation.position.set(-2, 0.6, -5.8); scene.add(foodStation);

        // เครื่องดื่ม
        const drinkBar = new THREE.Mesh(new THREE.BoxGeometry(2, 1.4, 1.2), matDark);
        drinkBar.position.set(-8.5, 0.7, -5.8); scene.add(drinkBar);

        // บาร์น้ำจิ้ม
        const sauceBar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 1), matDark);
        sauceBar.position.set(4, 0.5, 5.5); scene.add(sauceBar);

        // ปรับขนาดหน้าจออัตโนมัติ
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
