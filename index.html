<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Malatang Restaurant Floor Plan</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121212; font-family: 'Segoe UI', sans-serif; }
        #info {
            position: absolute; top: 15px; left: 15px; color: #e0e0e0;
            background: rgba(20, 20, 20, 0.85); padding: 12px 18px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #8b2626; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #info h2 { margin: 0 0 4px 0; font-size: 15px; color: #d96b6b; }
        #info p { margin: 0; font-size: 11px; color: #a0a0a0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h2>ผังจำลองร้านหม่าล่าทัง 3D (โทนสีนุ่มนวล)</h2>
        <p>🖱️ คลิกซ้ายลาก = หมุน | 🖱️ คลิกขวาลาก = ย้ายตำแหน่ง | 🔍 สกรอลล์ = ซูม</p>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 22, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // แสงสว่างแบบละมุน (Soft Lighting)
        scene.add(new THREE.AmbientLight(0xfff8f0, 0.8));
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.9);
        dirLight.position.set(15, 30, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- โทนสีและวัสดุ (ปรับลดความสดของสี) ---
        const matFloorMain = new THREE.MeshStandardMaterial({ color: 0xd8d3cd, roughness: 0.3 }); // กระเบื้องครีมอมเทา
        const matFloorBack = new THREE.MeshStandardMaterial({ color: 0x99948f, roughness: 0.5 }); // พื้นครัว/ห้องน้ำ
        const matWallRed = new THREE.MeshStandardMaterial({ color: 0x7a2222, roughness: 0.6 });   // แดงเลือดหมูสไตล์จีน
        const matWallWhite = new THREE.MeshStandardMaterial({ color: 0xe6e2dd, roughness: 0.8 }); // ขาวควันบุหรี่
        const matTable = new THREE.MeshStandardMaterial({ color: 0xf0ece1, roughness: 0.2 });     // หินอ่อนครีม
        const matChair = new THREE.MeshStandardMaterial({ color: 0x8c2828, roughness: 0.5 });     // เบาะแดงละมุน
        const matDark = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.6 });      // ดำเทาเข้ม
        const matMetal = new THREE.MeshStandardMaterial({ color: 0xb5b5b5, metalness: 0.7, roughness: 0.3 }); // สแตนเลส
        const matWood = new THREE.MeshStandardMaterial({ color: 0x5c3a21, roughness: 0.7 });      // ไม้เข้ม

        // พื้นร้าน
        const floorMain = new THREE.Mesh(new THREE.BoxGeometry(16, 0.2, 14), matFloorMain);
        floorMain.position.set(-2, -0.1, 0); floorMain.receiveShadow = true; scene.add(floorMain);

        const floorBack = new THREE.Mesh(new THREE.BoxGeometry(6, 0.2, 14), matFloorBack);
        floorBack.position.set(9, -0.1, 0); floorBack.receiveShadow = true; scene.add(floorBack);

        // สร้างผนัง
        function addWall(x, z, w, d, color = matWallWhite) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, 2.5, d), color);
            wall.position.set(x, 1.25, z); wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
        }

        // ผนังตามแปลน
        addWall(-10.1, 0, 0.2, 14, matWallRed);
        addWall(0, -7.1, 20.4, 0.2, matWallRed);
        addWall(12.1, 0, 0.2, 14);
        addWall(-6, 7.1, 8.4, 0.2); addWall(6, 7.1, 12.4, 0.2);
        addWall(6, -0.5, 0.2, 13.2);
        addWall(3, -5.5, 6, 0.2, matWallRed);
        addWall(9, -4, 6, 0.2);

        // --- ชุดโต๊ะอาหาร + เตาหม่าล่า + เก้าอี้ ---
        function addTable(x, z) {
            const group = new THREE.Group();
            
            // โต๊ะ
            const table = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 2.2), matTable);
            table.position.y = 1; table.castShadow = true; group.add(table);
            
            // ขาโต๊ะ
            const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1), matDark);
            leg.position.y = 0.5; group.add(leg);

            // เตาไฟฟ้าฝังโต๊ะ (4 จุด)
            for(let i = -0.45; i <= 0.45; i += 0.9) {
                for(let j = -0.45; j <= 0.45; j += 0.9) {
                    const stoveRim = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.02, 0.38), matDark);
                    stoveRim.position.set(i, 1.05, j); group.add(stoveRim);
                    const stovePot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.04), matMetal);
                    stovePot.position.set(i, 1.07, j); group.add(stovePot);
                }
            }

            // เก้าอี้เบาะพนักพิง
            [[-1.4,0], [1.4,0], [0,-1.4], [0,1.4]].forEach((p, idx) => {
                const chair = new THREE.Group();
                const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.5), matChair);
                seat.position.y = 0.55; chair.add(seat);
                const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.08), matChair);
                back.position.set(0, 0.8, -0.21); chair.add(back);
                const legC = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.5, 0.46), matDark);
                legC.position.y = 0.25; chair.add(legC);

                chair.position.set(p[0], 0, p[1]);
                chair.rotation.y = idx === 0 ? Math.PI/2 : idx === 1 ? -Math.PI/2 : idx === 2 ? 0 : Math.PI;
                group.add(chair);
            });

            group.position.set(x, 0, z); scene.add(group);
        }

        // --- โซนกั้นฉากอินโทรเวิร์ต (ซ้ายมือ) ---
        function addBooth(x, z) {
            const group = new THREE.Group();
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.3, 0.08), matWallRed);
            wall.position.set(0, 0.65, 0); group.add(wall);

            const table = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.1, 1), matTable);
            table.position.set(0, 0.85, -0.6); group.add(table);

            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.4, 0.45), matChair);
            seat.position.set(0, 0.2, -1.2); group.add(seat);

            group.position.set(x, 0, z); scene.add(group);
        }

        // วางโต๊ะและฉากกั้น
        addTable(-3.5, -2); addTable(-3.5, 2.5);
        addTable(1.5, -2);  addTable(1.5, 2.5);
        [-3.5, -1.2, 1.1, 3.4].forEach(z => addBooth(-8.8, z));

        // --- แคชเชียร์ ---
        const cashierGroup = new THREE.Group();
        const counterBase = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.1, 1.2), matWallRed);
        counterBase.position.set(-8, 0.55, 5); cashierGroup.add(counterBase);
        const posMachine = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.4), matDark);
        posMachine.position.set(-8.5, 1.25, 5); cashierGroup.add(posMachine);
        scene.add(cashierGroup);

        // --- ชั้นตักอาหารยาว (พร้อมถาดวัตถุดิบหลากสี) ---
        const foodStation = new THREE.Group();
        const shelf = new THREE.Mesh(new THREE.BoxGeometry(6.5, 1.2, 1.8), matMetal);
        shelf.position.set(-2, 0.6, -5.8); foodStation.add(shelf);

        // จำลองถาดตักผัก/เนื้อสัตว์
        const foodColors = [0x43a047, 0xe53935, 0xfdd835, 0xffb300, 0xff8f00, 0x8d6e63];
        for(let rx = -2.8; rx <= 2.8; rx += 0.9) {
            for(let rz = -6.2; rz <= -5.2; rz += 0.8) {
                const color = foodColors[Math.floor(Math.random() * foodColors.length)];
                const tray = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.15, 0.6), new THREE.MeshStandardMaterial({color: color}));
                tray.position.set(rx - 2, 1.25, rz); foodStation.add(tray);
            }
        }
        scene.add(foodStation);

        // --- ตู้เครื่องดื่ม ---
        const drinkBar = new THREE.Mesh(new THREE.BoxGeometry(2, 1.6, 1.2), matDark);
        drinkBar.position.set(-8.5, 0.8, -5.8); scene.add(drinkBar);

        // --- บาร์น้ำจิ้ม ---
        const sauceBar = new THREE.Group();
        const sauceTable = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 1), matDark);
        sauceTable.position.set(4, 0.5, 5.5); sauceBar.add(sauceTable);
        for(let sx = 3.3; sx <= 4.7; sx += 0.4) {
            const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.25), matMetal);
            pot.position.set(sx, 1.12, 5.5); sauceBar.add(pot);
        }
        scene.add(sauceBar);

        // --- สุขภัณฑ์ห้องน้ำ & อ่างล้างมือ ---
        function addToilet(x, z) {
            const group = new THREE.Group();
            const bowl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.7), matWallWhite);
            bowl.position.set(x, 0.2, z); group.add(bowl);
            const tank = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.3), matWallWhite);
            tank.position.set(x, 0.55, z - 0.3); group.add(tank);
            scene.add(group);
        }
        addToilet(10.5, 3); addToilet(10.5, 0);

        const sink = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 0.8), matWood);
        sink.position.set(7.5, 0.45, 2.5); scene.add(sink);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
