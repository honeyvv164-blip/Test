<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Malatang Floor Plan</title>
    <style>
        body { margin: 0; overflow: hidden; background: #181818; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #ui-guide {
            position: absolute; top: 15px; left: 15px; color: #d0d0d0;
            background: rgba(25, 25, 25, 0.85); padding: 12px 18px; border-radius: 8px;
            pointer-events: none; border-left: 4px solid #7d4444; font-size: 12px;
        }
        #ui-guide h3 { margin: 0 0 4px 0; color: #e8a2a2; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-guide">
        <h3>ผังร้านหม่าล่าทัง 3D (โทนซอฟต์มินิมอล)</h3>
        <p>• คลิกซ้ายลาก = หมุนมุมมอง</p>
        <p>• คลิกขวาลาก = ขยับตำแหน่ง</p>
        <p>• สกรอลล์เมาส์ = ซูมเข้า-ออก</p>
    </div>

    <script>
        // ==========================================
        // 1. SETUP SCENE, CAMERA & LIGHTS
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 24, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // แสงสว่างแบบนุ่มนวล ไม่จ้า
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xfff8f0, 0.6);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // ==========================================
        // 2. MATERIALS (ปรับโทนสีละมุน นุ่มตา)
        // ==========================================
        const MAT = {
            floorMain:   new THREE.MeshStandardMaterial({ color: 0xe2ded9, roughness: 0.4 }), // ครีมเทาอ่อน
            floorBack:   new THREE.MeshStandardMaterial({ color: 0x8a8783, roughness: 0.6 }), // เทากลาง
            wallRed:     new THREE.MeshStandardMaterial({ color: 0x7d4444, roughness: 0.7 }), // แดงชาดหม่น (Muted Red)
            wallWhite:   new THREE.MeshStandardMaterial({ color: 0xeeebe7, roughness: 0.8 }), // ขาวครีม
            table:       new THREE.MeshStandardMaterial({ color: 0xf7f5f0, roughness: 0.2 }), // หินอ่อนนวล
            chair:       new THREE.MeshStandardMaterial({ color: 0x854848, roughness: 0.6 }), // เบาะน้ำตาลแดงซอฟต์
            dark:        new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 }), // เทาเข้ม
            metal:       new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.5 }), // สแตนเลส
            text:        new THREE.MeshBasicMaterial({ color: 0x222222 })
        };

        // ==========================================
        // 3. HELPER FUNCTIONS
        // ==========================================
        
        // สร้างผนัง
        function createWall(x, z, width, depth, color = MAT.wallWhite) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(width, 2.2, depth), color);
            wall.position.set(x, 1.1, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
        }

        // สร้างป้ายชื่อโซน (Text Label บนพื้น)
        function createLabel(text, x, z) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 256; canvas.height = 64;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 64);
            ctx.font = 'Bold 24px sans-serif';
            ctx.fillStyle = '#333333';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const labelMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, opacity: 0.85 });
            const label = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 0.6), labelMat);
            label.rotation.x = -Math.PI / 2;
            label.position.set(x, 0.02, z);
            scene.add(label);
        }

        // ==========================================
        // 4. BUILD FLOORS & WALLS
        // ==========================================
        // พื้น
        const floorMain = new THREE.Mesh(new THREE.BoxGeometry(16, 0.1, 14), MAT.floorMain);
        floorMain.position.set(-2, -0.05, 0); floorMain.receiveShadow = true; scene.add(floorMain);

        const floorBack = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 14), MAT.floorBack);
        floorBack.position.set(9, -0.05, 0); floorBack.receiveShadow = true; scene.add(floorBack);

        // ผนัง
        createWall(-10.1, 0, 0.2, 14, MAT.wallRed);
        createWall(0, -7.1, 20.4, 0.2, MAT.wallRed);
        createWall(12.1, 0, 0.2, 14);
        createWall(-6, 7.1, 8.4, 0.2); createWall(6, 7.1, 12.4, 0.2);
        createWall(6, -0.5, 0.2, 13.2);
        createWall(3, -5.5, 6, 0.2, MAT.wallRed);
        createWall(9, -4, 6, 0.2);

        // ==========================================
        // 5. BUILD ZONES & FURNITURE
        // ==========================================

        // โซน 1: แคชเชียร์
        const cashier = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1, 1.2), MAT.wallRed);
        cashier.position.set(-8, 0.5, 5); scene.add(cashier);
        createLabel("1. แคชเชียร์", -8, 3.5);

        // โซน 2: โซนตักอาหาร
        const foodShelf = new THREE.Mesh(new THREE.BoxGeometry(6, 1.1, 1.6), MAT.metal);
        foodShelf.position.set(-2, 0.55, -5.8); scene.add(foodShelf);
        createLabel("2. โซนตักอาหาร", -2, -4.2);

        // โซน 3: ที่นั่งอินโทรเวิร์ต (ที่นั่งเดี่ยวฉากกั้น)
        function createBooth(x, z) {
            const group = new THREE.Group();
            const wall = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.2, 0.08), MAT.wallRed);
            wall.position.set(0, 0.6, 0); group.add(wall);
            const table = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.9), MAT.table);
            table.position.set(0, 0.8, -0.5); group.add(table);
            const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 0.4), MAT.chair);
            seat.position.set(0, 0.2, -1.1); group.add(seat);
            group.position.set(x, 0, z); scene.add(group);
        }
        [-3.5, -1.2, 1.1, 3.4].forEach(z => createBooth(-8.8, z));
        createLabel("3. ที่นั่งเดี่ยว", -6.5, 0);

        // โซน 4: โต๊ะกลุ่ม (4-8 คน)
        function createTableGroup(x, z) {
            const group = new THREE.Group();
            const table = new THREE.Mesh(new THREE.BoxGeometry(2, 0.1, 2), MAT.table);
            table.position.y = 0.9; group.add(table);
            [[-1.2,0], [1.2,0], [0,-1.2], [0,1.2]].forEach(p => {
                const chair = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.45, 0.5), MAT.chair);
                chair.position.set(p[0], 0.225, p[1]); group.add(chair);
            });
            group.position.set(x, 0, z); scene.add(group);
        }
        createTableGroup(-3.5, -2); createTableGroup(-3.5, 2.5);
        createTableGroup(1.5, -2);  createTableGroup(1.5, 2.5);
        createLabel("4. ที่นั่งกลุ่ม", -1, 0);

        // โซน 5: โซนรับอาหารเอง / บาร์น้ำจิ้ม
        const sauceBar = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.9, 1), MAT.dark);
        sauceBar.position.set(4, 0.45, 5.5); scene.add(sauceBar);
        createLabel("5. บาร์น้ำจิ้ม", 4, 4);

        // โซน 6: ห้องน้ำ
        const toilet1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.6), MAT.wallWhite);
        toilet1.position.set(10.5, 0.35, 3); scene.add(toilet1);
        const toilet2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.6), MAT.wallWhite);
        toilet2.position.set(10.5, 0.35, 0); scene.add(toilet2);
        createLabel("6. ห้องน้ำ", 9, 1.5);

        // โซน 7 & 8: ห้องเก็บของ / ครัวหลังบ้าน
        createLabel("7. ห้องเก็บของ", 3, -3.5);
        createLabel("8. โซนหลังครัว", 9, -5.5);

        // เครื่องดื่ม
        const drinkBar = new THREE.Mesh(new THREE.BoxGeometry(2, 1.3, 1.2), MAT.dark);
        drinkBar.position.set(-8.5, 0.65, -5.8); scene.add(drinkBar);

        // ==========================================
        // 6. RENDER & RESIZE
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
